tags:
  - contacts
summary: Create a new contact
operationId: createContact
description: Add a new contact to the database.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
          phoneNumber:
            type: string
          email:
            type: string
            format: email
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: [work, home, personal]
          photo:
            type: string
            format: binary
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../components/schemas/ApiResponse.yaml'
            - type: object
              properties:
                data:
                  $ref: '../../components/schemas/Contact.yaml'
  '400':
    description: Bad request
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorResponse.yaml'
