tags:
  - contacts
summary: Get list of contacts
operationId: getContacts
description: Retrieve a paginated, optionally filtered and sorted list of user's contacts.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema: { type: integer, minimum: 1 }
    description: Page number
  - in: query
    name: perPage
    schema: { type: integer, minimum: 1 }
    description: Items per page
  - in: query
    name: sortBy
    schema: { type: string }
    description: Field to sort by (e.g. name, email, phoneNumber, contactType)
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
    description: Sort direction
  - in: query
    name: type
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter by contact type
  - in: query
    name: isFavourite
    schema: { type: boolean }
    description: Filter by favourite flag
responses:
  '200':
    description: A paginated list of contacts with metadata
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../components/schemas/ApiResponse.yaml'
            - type: object
              properties:
                data:
                  $ref: '../../components/schemas/PaginatedContacts.yaml'
