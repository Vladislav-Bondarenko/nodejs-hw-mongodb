tags:
  - contacts
summary: Get list of contacts
operationId: getContacts
description: Retrieve a paginated list of all user's contacts. Optionally filter by favorite.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
    description: Page number for pagination
  - in: query
    name: limit
    schema:
      type: integer
      minimum: 1
    description: Number of contacts per page
  - in: query
    name: favorite
    schema:
      type: boolean
    description: Filter by favorite status
responses:
  '200':
    description: List of contacts
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
