type: object
required:
  [data, page, perPage, totalItems, totalPages, hasPreviousPage, hasNextPage]
properties:
  data:
    type: array
    items:
      $ref: './Contact.yaml'
  page:
    type: integer
    example: 1
  perPage:
    type: integer
    example: 10
  totalItems:
    type: integer
    example: 37
  totalPages:
    type: integer
    example: 4
  hasPreviousPage:
    type: boolean
    example: false
  hasNextPage:
    type: boolean
    example: true
