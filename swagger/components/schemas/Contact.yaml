type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    type: string
  name:
    type: string
  phoneNumber:
    type: string
  email:
    type: string
    format: email
  isFavourite:
    type: boolean
  contactType:
    type: string
    enum: [work, home, personal]
  photo:
    type: string
    format: uri
