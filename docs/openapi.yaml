openapi: 3.1.0
info:
  version: 1.0.0
  title: Contact Book API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: |
    This is the API documentation for the Contact Book application.

tags:
  - name: contacts
    description: Everything about contacts

servers:
  - url: http://localhost:3000
  - url: https://your-deployed-project.onrender.com

paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
      tags:
        - contacts
      summary: Get all contacts
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: Number of contacts per page
        - in: query
          name: favorite
          schema:
            type: boolean
          description: Filter contacts by favorite status
      responses:
        '200':
          description: A list of contacts

    post:
      $ref: ../swagger/paths/contacts/post.yaml
      tags:
        - contacts
      summary: Create a new contact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                favorite:
                  type: boolean
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Contact created successfully

  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/{contactId}/get.yaml
      tags:
        - contacts
      summary: Get a contact by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: contactId
          required: true
          schema:
            type: string
          description: The contact ID
      responses:
        '200':
          description: Contact found
        '404':
          description: Contact not found

    patch:
      $ref: ../swagger/paths/contacts/{contactId}/patch.yaml
      tags:
        - contacts
      summary: Update a contact by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: contactId
          required: true
          schema:
            type: string
          description: The contact ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                favorite:
                  type: boolean
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Contact updated
        '404':
          description: Contact not found

    delete:
      $ref: ../swagger/paths/contacts/{contactId}/delete.yaml
      tags:
        - contacts
      summary: Delete a contact by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: contactId
          required: true
          schema:
            type: string
          description: The contact ID
      responses:
        '200':
          description: Contact deleted
        '404':
          description: Contact not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

schemas:
  Contact:
    $ref: ../swagger/components/schemas/Contact.yaml
  Error:
    $ref: ../swagger/components/schemas/Error.yaml
